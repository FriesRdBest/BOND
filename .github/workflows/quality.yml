name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install project tooling
        run: python -m pip install uv==0.13.1

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check src tests scripts app.py

      - name: Check lint
        run: uv run ruff check src tests scripts app.py

      - name: Check types
        run: uv run pyright

      - name: Run automated tests
        run: uv run pytest -q

      - name: Check local disclosure patterns
        run: uv run python scripts/check_secrets.py

      - name: Audit locked application dependencies
        run: |
          mkdir -p .artifacts
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file .artifacts/audit-requirements.txt > /dev/null
          uv run pip-audit --disable-pip --no-deps -r .artifacts/audit-requirements.txt
