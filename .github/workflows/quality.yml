name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python contracts and quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install project tooling
        run: python -m pip install uv==0.13.1

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check src tests scripts app.py

      - name: Check lint
        run: uv run ruff check src tests scripts app.py

      - name: Check strict types
        run: uv run pyright

      - name: Run regression tests
        run: uv run pytest -q

      - name: Check local disclosure patterns
        run: uv run python scripts/check_secrets.py

      - name: Audit hashed application dependencies
        run: |
          mkdir -p .artifacts
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file .artifacts/audit-requirements.txt > /dev/null
          uv run pip-audit --disable-pip --require-hashes -r .artifacts/audit-requirements.txt

  frontend:
    name: Frontend build and browser behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Configure Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install project tooling
        run: |
          python -m pip install uv==0.13.1
          npm install --global npm@11.19.0 --ignore-scripts

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install frontend dependencies without lifecycle scripts
        working-directory: frontend/evidence
        run: npm ci --ignore-scripts

      - name: Check frontend contracts and build
        working-directory: frontend/evidence
        run: npm run check

      - name: Confirm committed assets match the build
        run: git diff --exit-code -- src/bond/data/web/evidence

      - name: Audit frontend dependencies
        working-directory: frontend/evidence
        run: npm audit --audit-level=low

      - name: Install Chromium test runtime
        working-directory: frontend/evidence
        run: npx playwright install --with-deps chromium

      - name: Run real browser checks
        working-directory: frontend/evidence
        run: npm run test:browser

      - name: Verify packaged component
        run: |
          uv build --wheel
          uv run python scripts/check_component_package.py
